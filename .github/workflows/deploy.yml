name: Deploy to Cloud Run

# main は直接 push を禁止している（GitHub ルールセット）ため、
# main への push は PR のマージ時のみ発生する = マージ時のみデプロイされる。
on:
  push:
    branches:
      - main
    # API バイナリ・コンテナイメージに影響するファイルが変更された場合のみデプロイする。
    # docs/ note/ README.md などドキュメント変更では不要なデプロイを発生させない。
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

# 同一ブランチへの連続 push 時は最新のみ実行する
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要

    env:
      SERVICE: kakeibo-api
      REGION: asia-northeast1
      # Artifact Registry のイメージパス
      # 事前に `gcloud artifacts repositories create kakeibo --repository-format=docker --location=asia-northeast1` で作成しておくこと
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kakeibo/kakeibo-api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Workload Identity Federation で認証
      # 必要な GitHub Secrets:
      #   GCP_PROJECT_ID       : GCP プロジェクト ID
      #   WIF_PROVIDER         : projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
      #   WIF_SERVICE_ACCOUNT  : github-actions@<project>.iam.gserviceaccount.com
      #   GOOGLE_CLIENT_ID     : OAuth 2.0 クライアント ID（Cloud Run の環境変数として渡す）
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # --allow-unauthenticated : IAM 認証はスキップ、アプリ層で Google ID Token と許可リストを検証
          # --service-account       : GCP ロールを持たない専用 SA で実行（既定の compute SA は Editor 権限を持つため使わない）
          # --max-instances=1       : 個人利用のため 1 台で十分。大量アクセス時の課金上限を抑える
          # ALLOWED_USER_IDS / DATABASE_URL / AUTH_TOKEN は Cloud Run に手動設定済み（env_vars の既定 merge で保持される）
          flags: '--allow-unauthenticated --service-account=kakeibo-api-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com --max-instances=1'
          env_vars: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
