name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    # API バイナリ・コンテナイメージに影響するファイルが変更された場合のみデプロイする。
    # docs/ note/ README.md などドキュメント変更では不要なデプロイを発生させない。
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'

# 同一ブランチへの連続 push 時は最新のみ実行する
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Workload Identity Federation に必要

    env:
      SERVICE: kakeibo-api
      REGION: asia-northeast1
      # Artifact Registry のイメージパス
      # 事前に `gcloud artifacts repositories create kakeibo --repository-format=docker --location=asia-northeast1` で作成しておくこと
      IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kakeibo/kakeibo-api
      # Node.js 24 への移行テスト（2026年6月のデフォルト変更に先行対応）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Workload Identity Federation で認証
      # 必要な GitHub Secrets:
      #   GCP_PROJECT_ID       : GCP プロジェクト ID
      #   WIF_PROVIDER         : projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
      #   WIF_SERVICE_ACCOUNT  : github-actions@<project>.iam.gserviceaccount.com
      #   GOOGLE_CLIENT_ID     : OAuth 2.0 クライアント ID（Cloud Run の環境変数として渡す）
      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: asia-northeast1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: '--allow-unauthenticated' # IAM 認証はスキップ、アプリ層で Google ID Token 検証
          env_vars: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
